<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1180" viewBox="0 0 560 1180">
  <!-- Опора ЛЭП, фронтальный ажурный силуэт по контрастному референсу:
       жирный контур, 3 ноги (2 наклонных + центральная), решётка крестов,
       2 маленьких траверсы у шпиля + 2 больших ниже с гирляндами изоляторов,
       бетонные фундаменты, трава. -->
  <defs>
    <style>
      .iron  { fill:none; stroke:#2c2f33; stroke-width:7; stroke-linecap:round; stroke-linejoin:round; }
      .thin  { fill:none; stroke:#2c2f33; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .insul { fill:none; stroke:#2c2f33; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .found { fill:#9a9a98; stroke:#2c2f33; stroke-width:4; }
      .grass { fill:none; stroke:#b6a98c; stroke-width:5; stroke-linecap:round; }
    </style>
  </defs>

  <!-- ======= ШПИЛЬ: ажурная башенка, сужается кверху ======= -->
  <g class="thin">
    <!-- контур шпиля -->
    <path d="M258 240 L276 78 M300 240 L284 78"/>
    <!-- вершина -->
    <path d="M276 78 L280 40 L284 78"/>
    <!-- горизонтальные пояса -->
    <path d="M262 118 L294 118"/>
    <path d="M260 158 L296 158"/>
    <path d="M259 200 L297 200"/>
    <!-- кресты -->
    <path d="M262 78 L296 118 M296 78 L262 118"/>
    <path d="M260 118 L296 158 M296 118 L260 158"/>
    <path d="M259 158 L297 200 M297 158 L259 200"/>
  </g>

  <!-- ======= МАЛЫЕ ТРАВЕРСЫ у шпиля ======= -->
  <!-- верхняя малая -->
  <path class="iron" d="M196 214 L360 214"/>
  <g class="thin">
    <path d="M258 238 L196 214 M258 238 L300 236"/>
    <path d="M300 238 L360 212 M300 238 L258 210"/>
  </g>
  <!-- нижняя малая -->
  <path class="iron" d="M170 338 L386 338"/>
  <g class="thin">
    <path d="M257 360 L170 342 M257 360 L300 354 M300 360 L386 334 M300 360 L257 320"/>
    <path d="M172 350 L384 332"/>
  </g>

  <!-- ======= БОЛЬШИЕ ТРАВЕРСЫ ======= -->
  <!-- верхняя большая -->
  <path class="iron" d="M118 558 L438 558"/>
  <g class="thin">
    <path d="M258 524 L118 564 M258 524 L300 560"/>
    <path d="M300 524 L438 548 M300 524 L258 542"/>
    <path d="M122 572 L434 550"/>
  </g>
  <!-- нижняя большая -->
  <path class="iron" d="M76 766 L480 766"/>
  <g class="thin">
    <path d="M258 730 L76 774 M258 730 L300 768 M300 730 L480 752 M300 730 L258 710"/>
    <path d="M80 782 L476 752"/>
  </g>

  <!-- ======= ГИРЛЯНДЫ ИЗОЛЯТОРОВ (зигзаг-ромбики) ======= -->
  <g class="insul">
    <!-- малые -->
    <path d="M198 216 l0 34 M196 216 l6 0 M196 226 l6 0 M196 236 l6 0 M196 246 l6 0"/>
    <path d="M358 216 l0 34 M356 216 l6 0 M356 226 l6 0 M356 236 l6 0 M356 246 l6 0"/>
    <path d="M170 340 l0 36 M168 340 l6 0 M168 350 l6 0 M168 360 l6 0 M168 370 l6 0"/>
    <path d="M386 340 l0 36 M384 340 l6 0 M384 350 l6 0 M384 360 l6 0 M384 370 l6 0"/>
    <!-- большие -->
    <path d="M120 562 l0 42 M118 562 l6 0 M118 574 l6 0 M118 586 l6 0 M118 598 l6 0"/>
    <path d="M436 562 l0 42 M434 562 l6 0 M434 574 l6 0 M434 586 l6 0 M434 598 l6 0"/>
    <path d="M78 770 l0 46 M76 770 l6 0 M76 782 l6 0 M76 794 l6 0 M76 806 l6 0"/>
    <path d="M478 770 l0 46 M476 770 l6 0 M476 782 l6 0 M476 794 l6 0 M476 806 l6 0"/>
  </g>

  <!-- ======= ПРОВОДА ======= -->
  <g class="thin">
    <path d="M0 150 C 100 176, 176 196, 216 216"/>
    <path d="M0 330 C 100 348, 150 360, 178 342"/>
    <path d="M0 540 C 100 556, 120 566, 116 574"/>
    <path d="M560 150 C 460 176, 386 196, 344 214"/>
    <path d="M560 330 C 460 348, 412 360, 380 340"/>
    <path d="M560 540 C 460 556, 442 566, 438 574"/>
  </g>

  <!-- ======= МАЧТА: каркас ======= -->
  <!-- центральная стойка -->
  <path class="iron" d="M278 568 L278 1040"/>
  <!-- боковые ноги: расходятся книзу -->
  <path class="iron" d="M256 240 L96 1080 M302 240 L462 1080"/>
  <!-- задние/передние внутренние наклоны (для объёма) -->
  <path class="thin" d="M258 300 L168 1040 M300 300 L390 1040"/>

  <!-- ======= РЕШЁТКА МАЧТЫ (кресты) ======= -->
  <g class="thin">
    <!-- верхний блок (между шпилем и верхней большой траверсой) -->
    <path d="M256 280 L278 360 M278 280 L256 360 M256 280 L300 330 M300 280 L256 340"/>
    <path d="M257 360 L278 440 M278 360 L257 440 M257 360 L300 410 M300 360 L257 420"/>
    <path d="M257 440 L278 520 M278 440 L257 520 M257 440 L300 490 M300 440 L257 500"/>
    <!-- средний блок -->
    <path d="M244 560 L278 660 M278 560 L244 660 M244 560 L312 620 M312 560 L244 620"/>
    <path d="M234 660 L278 760 M278 660 L234 760 M234 660 L322 700 M322 660 L234 700"/>
    <path d="M224 760 L278 860 M278 760 L224 860 M224 760 L330 800 M330 760 L224 800"/>
    <!-- нижний блок -->
    <path d="M210 860 L278 960 M278 860 L210 960 M210 860 L344 900 M344 860 L210 900"/>
    <path d="M188 960 L278 1040 M278 960 L188 1040 M188 960 L360 990 M360 960 L188 990"/>
    <!-- нижняя рама-крестовина -->
    <path d="M96 1080 L462 1040 M462 1080 L96 1040"/>
    <path d="M96 1080 L278 940 M462 1080 L278 940"/>
  </g>

  <!-- ======= ГОРИЗОНТАЛЬНЫЕ ПОЯСА ======= -->
  <g class="thin">
    <path d="M231 440 L325 440"/>
    <path d="M213 660 L343 660"/>
    <path d="M200 860 L356 860"/>
    <path d="M160 960 L396 960"/>
    <path d="M96 1040 L462 1040"/>
  </g>

  <!-- ======= ОСНОВАНИЕ: фундаменты + трава ======= -->
  <g class="found">
    <path d="M96 1080 L96 1116 L128 1116 L128 1080 Z"/>
    <path d="M266 1040 L266 1116 L292 1116 L292 1040 Z"/>
    <path d="M462 1080 L462 1116 L494 1116 L494 1080 Z"/>
  </g>
  <g class="grass">
    <path d="M60 1120 L100 1116 M1120 1116 L88 1120 M148 1116 L164 1122 M232 1120 L250 1116 M300 1118 L320 1122 M420 1118 L440 1116 M512 1116 L528 1122"/>
    <path d="M54 1132 L120 1126 M250 1132 L330 1126 M430 1132 L520 1126"/>
  </g>
</svg>