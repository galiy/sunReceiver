<svg xmlns="http://www.w3.org/2000/svg" width="520" height="560" viewBox="0 0 520 560">
  <!-- Инвертор Deye в анфас: светлый (белый/серый) прямоугольный корпус,
       чёрная панель-дисплей с рядами кнопок/индикаторов и дисплеем,
       клеммы и крепления снизу. Стилизованно, без мелких деталей. -->
  <defs>
    <style>
      .body  { fill:#e2e4e6; stroke:#c4c7cb; stroke-width:2; }
      .bodyR { fill:#d4d6d9; stroke:#c4c7cb; stroke-width:2; }
      .panel { fill:#1c1f22; stroke:#101215; stroke-width:2; }
      .dot   { fill:#f2f3f5; }
      .disp  { fill:#f4f5f6; stroke:#c9ccd0; stroke-width:2; }
      .therm { fill:none; stroke:#f2f3f5; stroke-width:2; }
      .tl    { fill:#2b2e31; }
      .term  { fill:#26292c; stroke:#0f1113; stroke-width:2; }
      .wing  { fill:#a9adb2; stroke:#90959a; stroke-width:2; }
    </style>
  </defs>

  <!-- корпус -->
  <path class="bodyR" d="M30 20 L490 20 L486 470 L34 470 Z"/>
  <path class="body" d="M42 30 L478 30 L474 462 L46 462 Z"/>

  <!-- марка справа вверху -->
  <text x="430" y="90" font-family="Arial" font-size="38" font-weight="bold" fill="#26364b" text-anchor="end" letter-spacing="2">Deye</text>

  <!-- чёрная панель-дисплей -->
  <rect class="panel" x="150" y="220" width="220" height="160" rx="20"/>

  <!-- ряд индикаторов/кнопок -->
  <g>
    <circle class="dot" cx="192" cy="252" r="6"/>
    <circle class="dot" cx="228" cy="252" r="6"/>
    <circle class="dot" cx="264" cy="252" r="6"/>
    <circle class="dot" cx="300" cy="252" r="6"/>
    <circle class="dot" cx="336" cy="252" r="6"/>
  </g>

  <!-- дисплей -->
  <rect class="disp" x="196" y="270" width="128" height="44" rx="4"/>

  <!-- стрелки/иконки управления -->
  <g class="therm" stroke-width="2">
    <path d="M200 342 L214 342 M207 336 L207 348"/>
    <path d="M230 336 L230 348 M224 342 L236 342"/>
    <path d="M256 336 L256 348 M250 342 L262 342"/>
    <path d="M282 342 L296 342 M289 336 L289 348"/>
    <path d="M314 342 L328 342 M321 336 L321 348 M314 336 L328 348"/>
  </g>

  <!-- клеммы снизу -->
  <g>
    <!-- болт-крепление слева -->
    <rect class="wing" x="70" y="470" width="44" height="18" rx="4"/>
    <rect class="term" x="86" y="486" width="20" height="22" rx="2"/>
    <!-- клеммы -->
    <rect class="term" x="170" y="466" width="26" height="44" rx="4"/>
    <rect class="term" x="206" y="466" width="26" height="44" rx="4"/>
    <!-- два винта -->
    <circle class="tl" cx="236" y="472" r="4"/>
    <circle class="tl" cx="256" cy="472" r="4"/>
    <!-- правая клемма -->
    <rect class="term" x="300" y="466" width="30" height="40" rx="4"/>
    <rect class="term" x="340" y="466" width="26" height="30" rx="4"/>
  </g>
</svg>