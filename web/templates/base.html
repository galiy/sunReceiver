{{define "head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
{{end}}
{{define "mnav"}}
<div class="mnav">
  <a href="/" {{if eq .active "home"}}class="active"{{end}}>Главная</a>
  <a href="/charts" {{if eq .active "charts"}}class="active"{{end}}>Графики</a>
  {{if .flags.ShowMeter}}<a href="/energy" {{if eq .active "energy"}}class="active"{{end}}>Электроэнергия</a>{{end}}
</div>
{{end}}
{{define "refreshToggle"}}
<label class="refresh-toggle" title="Выключить опрос API и обновление данных по таймеру">
  <input type="checkbox" id="refreshToggle">
  <span>Отключить обновление</span>
</label>
{{end}}
