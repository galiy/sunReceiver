<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360">
  <!-- МАП (преобразователь) в анфас: тёмная лицевая панель,
       3 ромбовидные секции: оранжевая с крупной тёмной кнопкой-розеткой,
       вентилятор (светлая рамка, тёмное нутро, светлая решётка),
       дисплей. Верхняя крышка, торцевая вентиляция справа. -->
  <defs>
    <style>
      .case  { fill:#232d38; stroke:#1a222b; stroke-width:2; }
      .top   { fill:#2b3642; stroke:#1a222b; stroke-width:2; }
      .orange{ fill:#e8622d; }
      .dkor  { fill:#c14e1e; }
      .frame { fill:#0e1113; stroke:#c9cdd2; stroke-width:3; }
      .oknob { fill:#8f969c; stroke:#6c737a; stroke-width:2; }
      .fanBr { fill:none; stroke:#c9cdd2; stroke-width:4; stroke-linecap:round; }
      .screen{ fill:#10161a; }
    </style>
  </defs>

  <!-- верхняя крышка и корпус -->
  <path class="top" d="M30 40 L730 40 L748 70 L12 70 Z"/>
  <path class="case" d="M12 70 L748 70 L738 340 L22 340 Z"/>

  <!-- === ЛЕВАЯ СЕКЦИЯ: оранжевый ромб с крупной тёмной кнопкой-розеткой === -->
  <g>
    <path class="orange" d="M150 98 L236 152 L236 264 L150 318 L64 264 L64 152 Z"/>
    <path class="dkor" d="M150 98 L236 152 M150 98 L64 152"/>
    <path class="dkor" d="M150 318 L236 264 M150 318 L64 264"/>
    <!-- большая тёмная кнопка-розетка -->
    <circle class="oknob" cx="150" cy="205" r="60"/>
    <circle cx="150" cy="205" r="40" fill="#7b8289" stroke="#6c737a" stroke-width="2"/>
  </g>

  <!-- === ЦЕНТР: вентилятор (светлая рамка, тёмное нутро) === -->
  <g>
    <path class="frame" d="M330 98 L416 152 L416 264 L330 318 L244 264 L244 152 Z"/>
    <circle cx="330" cy="208" r="66" fill="none" stroke="#c9cdd2" stroke-width="4"/>
    <!-- светлая решётка-лопасти -->
    <g class="fanBr">
      <path d="M330 148 L330 268 M268 208 L392 208 M287 166 L373 250 M373 166 L287 250"/>
    </g>
    <circle cx="330" cy="208" r="14" fill="#c9cdd2"/>
  </g>

  <!-- === ПРАВАЯ СЕКЦИЯ: дисплей (без оранжевых мелких деталей) === -->
  <g>
    <path class="frame" d="M486 98 L572 152 L572 264 L486 318 L400 264 L400 152 Z"/>
    <!-- дисплей -->
    <rect class="screen" x="446" y="150" width="80" height="60" rx="4"/>
    <!-- полоска-график на экране (циановые столбики) -->
    <g fill="#2fb1c9">
      <rect x="452" y="192" width="7" height="10"/>
      <rect x="462" y="186" width="7" height="16"/>
      <rect x="472" y="180" width="7" height="22"/>
      <rect x="482" y="186" width="7" height="16"/>
      <rect x="492" y="176" width="7" height="26"/>
    </g>
    <!-- круглая кнопка -->
    <circle cx="470" cy="288" r="15" fill="#cfd3d8" stroke="#a9adb2" stroke-width="2"/>
  </g>

  <!-- === ПРАВАЯ ТОРЦЕВАЯ ВЕНТИЛЯЦИЯ === -->
  <g stroke="#3a3f45" stroke-width="2">
    <path d="M700 90 L700 330 M716 90 L716 330"/>
  </g>
  <g fill="#15181b">
    <ellipse cx="700" cy="120" rx="26" ry="20"/>
    <ellipse cx="716" cy="120" rx="26" ry="20"/>
  </g>
</svg>